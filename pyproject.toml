[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-local"
version = "0.0.1"
description = "ATHENA local-first personal knowledge system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==49.0.0",
    "pypdf==6.12.2",
    "numpy==2.5.2",
    "usearch==2.26.0",
    "tzdata==2026.3",
]

[project.optional-dependencies]
desktop = [
    "PySide6-Essentials==6.11.1",
]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[project.scripts]
athena = "athena.__main__:main"
athena-recover = "athena.recovery_cli:main"
athena-desktop = "athena.desktop.app:main"

[tool.uv]
required-version = "==0.11.21"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
required-version = "==0.15.22"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src/athena"]
