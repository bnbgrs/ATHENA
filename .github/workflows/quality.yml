name: ATHENA Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned resolver
        run: |
          python -m pip install --disable-pip-version-check "pip==26.1.2"
          python -m pip install --disable-pip-version-check "uv==0.11.21"

      - name: Validate dependency lock
        run: uv lock --check

      - name: Run ATHENA quality gate
        run: uv run --locked --extra dev python scripts/quality.py
